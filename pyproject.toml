[project]
name = "pii-roundtrip"
version = "0.5.2"
description = "Local reversible anonymisation of Russian and UK English documents for use with external LLMs, and a benchmark of existing tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vladimir Beskorovainyi" }]
# the core (checksum rules, placeholders, vault, restoration) needs no models and no torch
dependencies = [
    "pymorphy3>=2",
    "pymorphy3-dicts-ru>=2.4",
    "cryptography>=48",
]

[project.optional-dependencies]
# Russian NER and name inflection (pii-guard, pinned commit)
ru = [
    "pii-guard[ner] @ git+https://github.com/redmadrobot-rnd/pii-guard@24230abb72949a9f85499244dd4f15a0ad0cdd9e",
    "ru_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
    "huggingface-hub>=0.30",
]
# GLiNER Guard Omni for Russian and English
gliner = [
    "gliner2>=2.1.0",
    "huggingface-hub>=0.30",
]
all = ["pii-roundtrip[ru,gliner]"]
# the benchmark: every compared tool and the dataset tooling
bench = [
    "pii-roundtrip[all]",
    "faker>=30",
    "pyarrow>=26.0.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "ru_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0-py3-none-any.whl",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "prompt-anonymizer==0.3.3",
    "opf @ git+https://github.com/openai/privacy-filter@f7f00ca7fb869683eb732c010299d901457f19c3",
]

[project.scripts]
pii-roundtrip = "pii_roundtrip.cli:main"

[project.urls]
Repository = "https://github.com/beskvladimir-create/pii-roundtrip"

[dependency-groups]
# the tests use the synthetic document generator (faker)
dev = ["pytest>=8", "faker>=30", "ruff==0.6.9", "mypy==1.13.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pii_roundtrip*"]

[tool.pytest.ini_options]
markers = ["models: needs the real models in the local cache"]
addopts = "-m 'not models'"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor", "manual"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Cyrillic text in strings and comments is intended; long string literals are left to the formatter
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["pii_roundtrip", "bench"]

[tool.mypy]
python_version = "3.12"
packages = ["pii_roundtrip"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pii_guard.*", "gliner2.*", "pymorphy3.*", "torch.*", "huggingface_hub.*"]
ignore_missing_imports = true

