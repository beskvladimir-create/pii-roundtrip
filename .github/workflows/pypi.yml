name: PyPI

# Publishes the Python package to PyPI with Trusted Publishing (no token is stored).
# Run by hand with the tag to publish; the tag must already be pushed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.1"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${{ inputs.tag }}"
      - name: Leave out the extras PyPI does not accept and build
        run: |
          python3 scripts/pypi_metadata.py
          uv build
      - name: Install the wheel and run the command line
        run: |
          uv venv -q /tmp/check
          uv pip install -q -p /tmp/check/bin/python dist/*.whl
          /tmp/check/bin/pii-roundtrip --help > /dev/null
      - uses: pypa/gh-action-pypi-publish@release/v1
